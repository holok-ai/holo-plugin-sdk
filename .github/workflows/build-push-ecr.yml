name: Build and Push to ECR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['*']

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  ECR_REGISTRY: 671482219051.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: holokai/dev/holo
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (dev)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ARTIFACTS_PUBLISHER_DEV_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # - name: Configure AWS credentials (release)
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_GITHUB_ARTIFACTS_PUBLISHER_RELEASE_ARN }}
      #     aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=git-{{sha}},enable=${{ github.event_name != 'pull_request' }}
            type=semver,pattern=v{{version}},enable=${{ github.ref_type == 'tag' }}
          labels: |
            ai.holokai.pr.url=${{ github.event.pull_request.html_url || '' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lint Dockerfile
        id: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        continue-on-error: true
        with:
          dockerfile: Dockerfile
          output-file: hadolint-results.txt

      - name: Comment hadolint results on PR
        if: github.event_name == 'pull_request' && steps.hadolint.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## Hadolint - Dockerfile Lint Results"
            echo ""
            echo '```'
            cat hadolint-results.txt
            echo '```'
          } > comment-body.md
          gh pr comment "$PR_NUMBER" --body-file comment-body.md

      # - name: Trivy Dockerfile misconfiguration scan
      #   id: trivy-misconfig
      #   uses: aquasecurity/trivy-action@master
      #   continue-on-error: true
      #   with:
      #     scan-type: config
      #     scan-ref: .
      #     format: table
      #     exit-code: '1'
      #     severity: CRITICAL,HIGH,MEDIUM
      #     output: trivy-misconfig-results.txt

      # - name: Comment Trivy misconfig results on PR
      #   if: github.event_name == 'pull_request' && steps.trivy-misconfig.outcome == 'failure'
      #   env:
      #     GH_TOKEN: ${{ github.token }}
      #     PR_NUMBER: ${{ github.event.pull_request.number }}
      #   run: |
      #     {
      #       echo "## Trivy - Dockerfile Misconfiguration Results"
      #       echo ""
      #       echo '```'
      #       cat trivy-misconfig-results.txt
      #       echo '```'
      #     } > comment-body.md
      #     gh pr comment "$PR_NUMBER" --body-file comment-body.md

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # - name: Run Trivy vulnerability scan
      #   id: trivy-vuln
      #   uses: aquasecurity/trivy-action@master
      #   continue-on-error: true
      #   with:
      #     image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
      #     format: table
      #     exit-code: '1'
      #     severity: CRITICAL,HIGH
      #     output: trivy-vuln-results.txt

      # - name: Upload Trivy vulnerability results
      #   if: steps.trivy-vuln.outcome == 'failure'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: trivy-vuln-results
      #     path: trivy-vuln-results.txt

      # - name: Comment Trivy vulnerability results on PR
      #   if: github.event_name == 'pull_request' && steps.trivy-vuln.outcome == 'failure'
      #   env:
      #     GH_TOKEN: ${{ github.token }}
      #     PR_NUMBER: ${{ github.event.pull_request.number }}
      #     RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      #   run: |
      #     MAX_CHARS=60000
      #     RESULTS=$(cat trivy-vuln-results.txt)
      #     {
      #       echo "## Trivy - Container Vulnerability Results"
      #       echo ""
      #       if [ ${#RESULTS} -gt $MAX_CHARS ]; then
      #         echo '```'
      #         echo "${RESULTS:0:$MAX_CHARS}"
      #         echo '```'
      #         echo ""
      #         echo "**Output truncated.** Full results available in [workflow artifacts](${RUN_URL})."
      #       else
      #         echo '```'
      #         echo "$RESULTS"
      #         echo '```'
      #       fi
      #     } > comment-body.md
      #     gh pr comment "$PR_NUMBER" --body-file comment-body.md

      - name: Write build summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Container Image"
            echo ""
            echo '```'
            echo "$TAGS"
            echo '```'
            echo ""
            echo "**Commit:** \`${COMMIT_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment image path on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TAGS: ${{ steps.meta.outputs.tags }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "## Container Image"
            echo ""
            echo '```'
            echo "$TAGS"
            echo '```'
            echo ""
            echo "**Commit:** \`${COMMIT_SHA}\`"
          } > comment-body.md
          gh pr comment "$PR_NUMBER" --body-file comment-body.md
