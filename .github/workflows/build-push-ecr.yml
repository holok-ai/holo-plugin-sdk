name: Build and Push to ECR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['*']

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  ECR_REGISTRY: 671482219051.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: holokai/dev/holo
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (dev)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ARTIFACTS_PUBLISHER_DEV_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # - name: Configure AWS credentials (release)
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_GITHUB_ARTIFACTS_PUBLISHER_RELEASE_ARN }}
      #     aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine image tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "tag=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set build labels
        id: labels
        if: github.event_name == 'pull_request'
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "labels<<EOF"
            echo "org.opencontainers.image.revision=${SHA}"
            echo "ai.holokai.pr.number=${PR_NUMBER}"
            echo "ai.holokai.pr.url=https://github.com/${REPO}/pull/${PR_NUMBER}"
            echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Lint Dockerfile
        id: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        continue-on-error: true
        with:
          dockerfile: Dockerfile
          output-file: hadolint-results.txt

      - name: Comment hadolint results on PR
        if: github.event_name == 'pull_request' && steps.hadolint.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## Hadolint - Dockerfile Lint Results"
            echo ""
            echo '```'
            cat hadolint-results.txt
            echo '```'
          } > comment-body.md
          gh pr comment "$PR_NUMBER" --body-file comment-body.md

      - name: Trivy Dockerfile misconfiguration scan
        id: trivy-misconfig
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH,MEDIUM
          output: trivy-misconfig-results.txt

      - name: Comment Trivy misconfig results on PR
        if: github.event_name == 'pull_request' && steps.trivy-misconfig.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## Trivy - Dockerfile Misconfiguration Results"
            echo ""
            echo '```'
            cat trivy-misconfig-results.txt
            echo '```'
          } > comment-body.md
          gh pr comment "$PR_NUMBER" --body-file comment-body.md

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          load: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
          labels: ${{ steps.labels.outputs.labels }}

      - name: Run Trivy vulnerability scan
        id: trivy-vuln
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          output: trivy-vuln-results.txt

      - name: Upload Trivy vulnerability results
        if: steps.trivy-vuln.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-vuln-results
          path: trivy-vuln-results.txt

      - name: Comment Trivy vulnerability results on PR
        if: github.event_name == 'pull_request' && steps.trivy-vuln.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MAX_CHARS=60000
          RESULTS=$(cat trivy-vuln-results.txt)
          {
            echo "## Trivy - Container Vulnerability Results"
            echo ""
            if [ ${#RESULTS} -gt $MAX_CHARS ]; then
              echo '```'
              echo "${RESULTS:0:$MAX_CHARS}"
              echo '```'
              echo ""
              echo "**Output truncated.** Full results available in [workflow artifacts](${RUN_URL})."
            else
              echo '```'
              echo "$RESULTS"
              echo '```'
            fi
          } > comment-body.md
          gh pr comment "$PR_NUMBER" --body-file comment-body.md

      - name: Write build summary
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Container Image"
            echo ""
            echo '```'
            echo "$IMAGE"
            echo '```'
            echo ""
            echo "**Tag:** \`${IMAGE_TAG}\`"
            echo "**Commit:** \`${COMMIT_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment image path on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "## Container Image"
            echo ""
            echo '```'
            echo "$IMAGE"
            echo '```'
            echo ""
            echo "**Tag:** \`${IMAGE_TAG}\`"
            echo "**Commit:** \`${COMMIT_SHA}\`"
          } > comment-body.md
          gh pr comment "$PR_NUMBER" --body-file comment-body.md
