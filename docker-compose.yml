services:
  holo:
    container_name: holokai-holo
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - RABBITMQ_URL=amqp://holokai-mq:5672
      - PORT=3000
      - AUDIT_PG_HOST=holokai-db
      - AUDIT_PG_PORT=5432
      - AUDIT_PG_DATABASE=holokai
      - AUDIT_PG_USER=holo
      - AUDIT_PG_PASSWORD=holopassword
      - AUDIT_ENABLED=true
      - JWT_SECRET=your-super-secret-key-at-least-32-characters-long-and-random
      - MOKU_URL=http://host.docker.internal:8080
      - API_SERVER_ID=duan_api
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      - API_PLUGINS_DIR=node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - audit_logs:/app/logs
    restart: unless-stopped
    networks:
      - holokai-network

volumes:
  audit_logs:

networks:
  holokai-network:
    external: true
    name: holokai-network
