x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-development}
  RABBITMQ_URL: ${RABBITMQ_URL:-amqp://holokai-mq:5672}
  AUDIT_PG_HOST: ${AUDIT_PG_HOST:-holokai-db}
  AUDIT_PG_PORT: ${AUDIT_PG_PORT:-5432}
  AUDIT_PG_DATABASE: ${AUDIT_PG_DATABASE}
  AUDIT_PG_USER: ${AUDIT_PG_USER}
  AUDIT_PG_PASSWORD: ${AUDIT_PG_PASSWORD}
  REDIS_URL: redis://holokai-redis:6379
  CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
  JWT_SECRET: ${JWT_SECRET}
  MOKU_URL: ${MOKU_URL:-http://host.docker.internal:8080}

x-common: &common
  image: "${DOCKER_REGISTRY:-holo}:${IMAGE_TAG:-latest}"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  networks:
    - holokai-network

services:
  api:
    <<: *common
    container_name: holokai-api
    build:
      context: .
      args:
        BUILD_MODE: dev
    ports:
      - "3000:3000"
    environment:
      <<: *common-env
      PORT: 3000
      API_SERVER_ID: ${API_SERVER_ID:-api}
      API_CONFIG_TIMEOUT: ${API_CONFIG_TIMEOUT:-120000}
      AUDIT_ENABLED: "true"
      ENABLE_API: "true"
      ENABLE_WORKER: "false"
      ENABLE_AUDIT: "false"
      ENABLE_BATCH: "false"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  worker:
    <<: *common
    container_name: holokai-worker
    environment:
      <<: *common-env
      ENABLE_API: "false"
      ENABLE_WORKER: "true"
      ENABLE_AUDIT: "false"
      ENABLE_BATCH: "false"
    deploy:
      replicas: 1

  audit:
    <<: *common
    container_name: holokai-audit
    environment:
      <<: *common-env
      AUDIT_ENABLED: "true"
      ENABLE_API: "false"
      ENABLE_WORKER: "false"
      ENABLE_AUDIT: "true"
      ENABLE_BATCH: "false"
    volumes:
      - audit_logs:/app/logs

  batch:
    <<: *common
    container_name: holokai-batch
    environment:
      <<: *common-env
      ENABLE_API: "false"
      ENABLE_WORKER: "false"
      ENABLE_AUDIT: "false"
      ENABLE_BATCH: "true"

  redis:
    container_name: holokai-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - holokai-network

volumes:
  audit_logs:

networks:
  holokai-network:
    external: true
    name: holokai-network
