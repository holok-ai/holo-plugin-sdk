version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - RABBITMQ_URL=amqp://rabbitmq
      - PORT=3000
    volumes:
      - ./src:/app/src
    depends_on:
      - rabbitmq
    restart: unless-stopped
    networks:
      - llm-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "src/worker/llm-worker.js"]
    environment:
      - NODE_ENV=production
      - RABBITMQ_URL=amqp://rabbitmq
    volumes:
      - ./src:/app/src
    depends_on:
      - rabbitmq
    restart: unless-stopped
    deploy:
      replicas: 3
    networks:
      - llm-network

  audit-service:
    build:
      context: .
      dockerfile: Dockerfile.audit
    environment:
      - NODE_ENV=production
      - RABBITMQ_URL=amqp://rabbitmq
      - AUDIT_ENABLED=true
      - AUDIT_PG_HOST=postgres
      - AUDIT_PG_PORT=5432
      - AUDIT_PG_DATABASE=llm_audit
      - AUDIT_PG_USER=postgres
      - AUDIT_PG_PASSWORD=postgrespassword
      - LOG_DIR=/app/logs
    volumes:
      - ./src:/app/src
      - audit_logs:/app/logs
    depends_on:
      - rabbitmq
      - postgres
    restart: unless-stopped
    networks:
      - llm-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - llm-network

  postgres:
    image: postgres:17.4-alpine3.21
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=llm_audit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llm-network
      
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=adminpassword
    depends_on:
      - postgres
    networks:
      - llm-network

volumes:
  rabbitmq_data:
  postgres_data:
  audit_logs:

networks:
  llm-network:
    driver: bridge
