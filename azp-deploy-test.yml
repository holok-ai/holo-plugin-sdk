# pipeline for building and deploying llm-proxy to test environment

resources:
  repositories:
  - repository: llm-proxy
    name: Project NOVA/llm-proxy
    type: git
    trigger:
        branches:
          include:
            - main
  - repository: dynamo-app-ops
    name: dynamo-ops/dynamo-app-ops
    type: git
    endpoint: DynamoOpsServiceConnection
    ref: main
    
stages:
- stage: Build
  displayName: Build llm-proxy images
  jobs:
  - job: Build
    displayName: Build
    pool:
      name: nova-gpu-3

    steps:
    - checkout: llm-proxy
    - checkout: dynamo-app-ops
    
    - task: InstallSSHKey@0
      inputs:
        knownHostsEntry: '10.0.1.173 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBL3pztDIF8SEr6sQAeMaCPRjXRRMLCa4kPq65erou0sPs8rKwyUqX48142SPKCdUxf7jKnGk/8zodDPv4LCLsZk='
        sshKeySecureFile: dynamo-nova.key

    - task: Docker@2
      inputs:
        command: 'build'
        Dockerfile: 'llm-proxy/Dockerfile'
        repository: 'llm-proxy-api'
        tags: 'latest'
        buildContext: '$(Pipeline.Workspace)/s'

    - task: Docker@2
      inputs:
        command: 'build'
        Dockerfile: 'llm-proxy/Dockerfile.audit'
        repository: 'llm-proxy-audit-service'
        tags: 'latest'
        buildContext: '$(Pipeline.Workspace)/s/llm-proxy'

